{% extends "base.html" %}
{% block content %}
<h1>{% if tutor %}Edit {{ tutor.name }}{% else %}Add a tutor{% endif %}</h1>
{% if errors %}
  <div class="errors"><ul>
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul></div>
{% endif %}
<form method="post" action="{% if tutor %}/tutors/{{ tutor.id }}/edit{% else %}/tutors/new{% endif %}">
  <label>Name
    <input type="text" name="name" value="{{ form.get('name', '') }}">
  </label>
  <label>Phone
    <input type="text" name="phone" value="{{ form.get('phone', '') }}">
  </label>
  <label>Subjects
    <input type="text" name="subjects" value="{{ form.get('subjects', '') }}" placeholder="e.g. Physics, Maths">
  </label>
  <p>
    <button type="submit">{% if tutor %}Save{% else %}Add tutor{% endif %}</button>
    <a class="button secondary" href="/tutors">Cancel</a>
  </p>
</form>
{% endblock %}
